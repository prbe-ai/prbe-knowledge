name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      # Retrieval indexes that exist, are paid for, and are silently bypassed
      # because the query no longer matches their expression. Four separate
      # production incidents, none of which failed a test -- Postgres answers
      # correctly, just by scanning. Runs here rather than as a pytest test
      # because this workflow does not run pytest.
      - name: Index contracts
        run: .venv/bin/python scripts/check_index_contracts.py

      - name: Type-check
        run: .venv/bin/mypy engine kb services || true   # strict mypy soft-gated in Phase 0

  # Runs the pytest suite against a real Postgres + MinIO (the S3-API store the
  # tests talk to as R2). This repo is low-churn and had NO pytest gate for a
  # while, so a change like the S3 backend support (#460) shipped with its unit
  # tests green locally but never exercised in CI. This restores that gate.
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prbe
          POSTGRES_PASSWORD: prbe
          POSTGRES_DB: prbe_knowledge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prbe -d prbe_knowledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_SYNC: postgresql+psycopg://prbe:prbe@localhost:5432/prbe_knowledge
      DATABASE_URL: postgresql://prbe:prbe@localhost:5432/prbe_knowledge
      PGPASSWORD: prbe

    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO (S3-API store the tests use as R2)
        # quay.io, NOT Docker Hub. `minio/minio` on Docker Hub started
        # answering `pull access denied ... repository does not exist or may
        # require 'docker login'` (exit 125) on 2026-09-11, and it is not a
        # rate limit: an anonymous pull of quay.io/minio/minio succeeds from
        # the same host in the same minute. quay.io is MinIO's own registry and
        # is what their docs point at.
        #
        # The step fails BEFORE pytest, so the whole gate goes red and no test
        # result is produced -- which reads as "the merge broke the tests"
        # rather than "the image vanished". Worth knowing when this recurs.
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in {1..30}; do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy"; docker logs minio; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      # Fresh DB: apply db/schema.sql (canonical-latest) directly and stamp alembic
      # head, rather than `alembic upgrade head` -- migrations 0007+ duplicate state
      # schema.sql already creates, so the upgrade chain throws on an empty DB.
      # neon_auth is provisioned for real in prod (Neon); the shim stands in here.
      - name: Provision neon_auth shim
        run: |
          psql -h localhost -p 5432 -U prbe -d prbe_knowledge -v ON_ERROR_STOP=1 <<'SQL'
            CREATE SCHEMA IF NOT EXISTS neon_auth;
            CREATE TABLE IF NOT EXISTS neon_auth.organization (id UUID PRIMARY KEY);
            CREATE TABLE IF NOT EXISTS neon_auth."user" (
              id UUID PRIMARY KEY,
              organization_id UUID REFERENCES neon_auth.organization(id),
              email TEXT,
              name TEXT
            );
          SQL

      - name: Apply schema and stamp alembic
        run: |
          psql -h localhost -p 5432 -U prbe -d prbe_knowledge -v ON_ERROR_STOP=1 -f db/schema.sql
          .venv/bin/alembic stamp head

      # These tests deliberately reset their schemas. Separate databases keep
      # receipt races and fresh-install checks away from the shared live_db
      # fixtures, and explicit URLs prevent a green run that skips the contract.
      - name: Provision isolated session contract databases
        run: |
          createdb -h localhost -p 5432 -U prbe session_receipts_test
          createdb -h localhost -p 5432 -U prbe backfill_schema_test

      # The credential-redaction suite scans with the real gitleaks binary.
      # Without it that suite SKIPS, which reads as a pass — so the suite
      # raises in CI when the binary is absent rather than quietly skipping,
      # and this step is what keeps it present.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tools/redactd/go.sum

      - name: Build redactd
        # The differential suite compares the daemon against the CLI on the
        # outage corpus. Without the binary those tests SKIP, and a skip that
        # looks like a pass is how a credential gate stops gating -- so
        # tests/test_redactd.py raises in CI rather than skipping.
        run: |
          go -C tools/redactd build -o "$RUNNER_TEMP/redactd" .
          echo "PROBE_REDACTD_BIN=$RUNNER_TEMP/redactd" >> "$GITHUB_ENV"

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The transcript-extraction files below (signals, backfill, coalescing,
      # finalize e2e, extraction) ran NOWHERE before 2026-09-23 -- including the
      # only test of the sweep/worker handshake whose disagreement re-mined every
      # idle session daily. Keep comments here, above the step: a `#` inside the
      # folded `run: >-` scalar comments out every file after it.
      - name: Tests (session protocol and bootstrap)
        env:
          PRBE_RECEIPT_TEST_DATABASE_URL: postgresql://prbe:prbe@localhost:5432/session_receipts_test
          PRBE_SCHEMA_TEST_DATABASE_URL: postgresql://prbe:prbe@localhost:5432/backfill_schema_test
        run: >-
          .venv/bin/pytest -q
          tests/test_session_receipts.py
          tests/test_session_receipts_bootstrap.py
          tests/test_session_completer.py
          tests/test_session_signals.py
          tests/test_backfill_finalize_markers.py
          tests/test_rechunk_collapsed_sessions.py
          tests/test_session_end_report.py
          tests/test_session_coalescing.py
          tests/test_claude_code_finalize_e2e.py
          tests/test_claude_code_extraction.py
          tests/test_extraction_segment_cache.py
          tests/handlers/test_claude_code_parse_webhook_event.py
          tests/handlers/test_claude_code_fetch_supplementary.py
          tests/handlers/test_claude_code_normalize.py
          tests/handlers/test_claude_code_extract_external_id.py
          tests/handlers/test_codex_registration.py
          tests/handlers/test_pi_registration.py
          tests/test_secret_redaction.py
          tests/test_secret_persistence_boundaries.py
          tests/test_manual_upload_secret_boundary.py
          tests/test_boolean_credential_controls.py
          tests/test_webhook_log_redaction.py
          tests/test_credential_sweep.py
          tests/test_queue_tiers.py
          tests/test_redactd.py
          tests/test_scanner_image_packaging.py
          tests/test_claim_protocol.py
          tests/test_queue_age.py

      # Scoped to the STORAGE suite (Postgres + MinIO), not `tests/` wholesale.
      # The full suite has ~42 pre-existing failures unrelated to storage: tests that
      # need the ParadeDB/BM25 extension or a live Gemini key, plus stale expectations
      # left by a code-graph label refactor (Function/Class/Module -> CodeSymbol, Repo ->
      # Document). De-drifting that is its own effort; gating on it now would just paint
      # every PR red. This gate covers the object-store backend + blob/upload paths -- the
      # area #460 touched -- and can widen as the rest of the suite is repaired.
      #
      # The ten `test_workflow_memory_*.py` files are on this list deliberately,
      # and the reason is one this gate keeps re-learning: a hand-picked file
      # list means new work ships with a green check and untested code unless
      # somebody remembers this step. It happened with the wiki routes, and
      # again with PR #476, whose `pytest` check went green without running a
      # single one of the tests it added.
      #
      # Workflow memory is the whole procedure store -- tenant isolation on five
      # tables, the RLS policies, the secret-scan-at-ingest guard, the
      # single-author visibility rule, and the serve ledger. Every one of those
      # is a security property whose failure is SILENT: a cross-tenant read
      # returns rows, a missing scan stores a credential, a dropped visibility
      # predicate publishes somebody's private note. None of them raise. The
      # tests are the only thing that notices, so they have to actually run.
      #
      # `tests/retrieval/agent/` is on the list for the same reason and costs
      # nothing: 273 tests, ~1.2s, no Postgres and no MinIO -- the LLM is
      # mocked throughout. It guards the gatherer's terminal-args coercer,
      # which is the ONLY thing standing between a non-strict provider's
      # schema drift and a user losing their whole answer (the enforcement it
      # replaced went away with the Cerebras swap, PR #320). A silent
      # regression there degrades every search and raises no error.
      #
      # They need Postgres (already provisioned above) and nothing else -- the
      # embedder and both model calls are stubs, because conftest blanks the
      # provider keys. The classifier's real-accuracy block skips itself without
      # a key rather than failing.
      #
      # The vector-channel SQL-shape files (test_ann_order_by_shape,
      # test_vector_per_source_ann*, test_vector_recency_pool) pin the ORDER BY
      # / LIMIT the HNSW index can serve; they were not on the list when the
      # recency path silently dropped its LIMIT. test_custom_ingest and
      # test_backfill_custom_doc_types cover the custom.<type> doc_type mapping
      # and its backfill; test_retire_experiment_nodes covers folding the retired
      # Experiment graph nodes into their Project nodes (T6).
      #
      # The three test_auto_merge_* files cover entity auto-merge, which on the
      # managed plane EXECUTES real merges: the Jev judge's request and verdict
      # bands, the execution-evidence gate, the gpt-oss rollback path, and
      # (live) ingest -> queue -> worker -> merge on real Postgres, including
      # the deferral that keeps a node queued through a Jev outage and the
      # per-(tenant, label) merge lock. test_entity_clusters_routes covers the
      # merge transaction itself (merge_cluster), which auto-merge calls.
      # test_alias_chains_and_enqueue covers alias routing through merge chains
      # (write and read path) and the insert-or-change gate on the post-write
      # queue, with the two retrieval alias-helper suites beside it.
      # Keep every tests/retrieval/ path in ONE run: a file from elsewhere
      # between two of them makes pytest drop tests/retrieval/conftest.py's
      # fixtures for the second half ("fixture 'recorded' not found").
      # NEVER put a `#` comment INSIDE the folded `run: >-`
      # scalar below: YAML folds it into one line and the first `#` comments
      # out every path after it -- CI stays green and runs none of them.
      - name: Tests (storage + workflow-memory suites)
        run: >-
          .venv/bin/pytest -q
          tests/test_github_installation_controls.py
          tests/test_github_legacy_purge_barrier.py
          tests/test_github_rollout_compatibility.py
          tests/handlers/test_github.py
          tests/test_backend_client.py
          tests/test_codegraph_github_branch_filter.py
          tests/test_workflow_memory_capabilities.py
          tests/test_workflow_memory_classifier.py
          tests/test_workflow_memory_declaring.py
          tests/test_workflow_memory_endpoints.py
          tests/test_workflow_memory_isolation.py
          tests/test_workflow_memory_publication.py
          tests/test_workflow_memory_secret_scan.py
          tests/test_workflow_memory_serving.py
          tests/test_workflow_memory_structuring.py
          tests/test_workflow_memory_visibility.py
          tests/test_object_store_s3.py
          tests/test_storage_list_keys.py
          tests/test_persist_trace_blob_r2.py
          tests/test_query_traces_trace_blob_migration.py
          tests/handlers/test_manual_upload.py
          tests/handlers/test_slack.py
          tests/test_pg_search_guardian.py
          tests/test_pg_search_rebuild.py
          tests/test_litellm_key.py
          tests/retrieval/test_tenant_key_binding.py
          tests/retrieval/agent/
          tests/retrieval/test_ann_order_by_shape.py
          tests/retrieval/test_vector_per_source_ann.py
          tests/retrieval/test_vector_per_source_ann_binding.py
          tests/retrieval/test_vector_recency_pool.py
          tests/retrieval/test_chunks_partition_pruning.py
          tests/retrieval/test_dedupe_gathered.py
          tests/retrieval/test_graph_discovery_ordering.py
          tests/retrieval/test_bm25_project_scope_shape.py
          tests/retrieval/test_helpers_resolve_aliases.py
          tests/retrieval/test_helpers_expand_to_cluster_members.py
          tests/test_bm25_index_generations.py
          tests/test_custom_ingest.py
          tests/test_backfill_custom_doc_types.py
          tests/test_retire_experiment_nodes.py
          tests/test_auto_merge_analyzer.py
          tests/test_auto_merge_jev_judge.py
          tests/test_auto_merge_twins.py
          tests/test_auto_merge_live.py
          tests/test_entity_clusters_routes.py
          tests/test_alias_chains_and_enqueue.py
