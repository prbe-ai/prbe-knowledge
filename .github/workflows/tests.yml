name: lint+typecheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      # Retrieval indexes that exist, are paid for, and are silently bypassed
      # because the query no longer matches their expression. Four separate
      # production incidents, none of which failed a test -- Postgres answers
      # correctly, just by scanning. Runs here rather than as a pytest test
      # because this workflow does not run pytest.
      - name: Index contracts
        run: .venv/bin/python scripts/check_index_contracts.py

      - name: Type-check
        run: .venv/bin/mypy engine kb services || true   # strict mypy soft-gated in Phase 0
